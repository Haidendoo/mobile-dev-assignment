name: Android foundation
on:
  push:
    paths: ['app/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build apk --debug --target-platform android-arm64 --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: forest-sokoban-foundation-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk
