name: forest_sokoban
description: An offline forest puzzle campaign for Android.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  flutter_svg: ^2.4.0
  sqflite: ^2.4.2
  path: ^1.9.1
  uuid: ^4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
flutter:
  uses-material-design: true
  assets:
    - assets/data/levels.json
    - assets/figma/home/
    - assets/figma/scenes/
    - assets/fonts/IBMPlexMono-OFL.txt
    - assets/fonts/CormorantGaramond-OFL.txt
    - assets/fonts/DMSans-OFL.txt
  fonts:
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
          weight: 700
        - asset: assets/fonts/CormorantGaramond-Italic.ttf
          style: italic
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
        - asset: assets/fonts/DMSans.ttf
          weight: 700
